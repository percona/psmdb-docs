name: Check Markdown links
on:
  pull_request:

jobs:
  mkdocs-link-check:
    name: Check external and internal links
    runs-on: ubuntu-latest

    steps:
      #Pull the latest changes
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      #Check external links in docs (internal links are checked by the strict build)
      #Skipped:
      #  - localhost: example addresses, not links
      #  - entra.microsoft.com: sign-in portal that blocks automated requests
      #  - VEX files: URLs built with {{ macros }} are incomplete in the Markdown source
      #The GitHub token avoids rate limits on github.com links.
      - name: Check external links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress
            --scheme https
            --scheme http
            --timeout 30
            --max-retries 5
            --retry-wait-time 2
            --exclude-loopback
            --exclude 'entra\.microsoft\.com'
            --exclude 'percona\.github\.io/percona-server-mongodb/vex/'
            'docs/**/*.md'

  mkdocs-strict-build:
    name: Check internal links
    runs-on: ubuntu-latest

    steps:
      #Pull the latest changes
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      #Prepare the env
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.x'

      #Set up MkDocs
      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      #Strict mode fails the build on links to missing pages or images.
      #Git plugins are disabled: they need full history and API access, not links.
      - name: Build docs in strict mode
        env:
          CI: false
          ENABLED_GIT_REVISION_DATE: false
        run: mkdocs build --strict -f mkdocs.yml
