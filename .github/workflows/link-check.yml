name: Check Markdown links
on:
  pull_request:

jobs:
  mkdocs-link-check:
    name: Check external and internal links
    runs-on: ubuntu-latest

    steps:
      #Pull the latest changes
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      #Check external links in docs (boolean inputs expect 'yes')
      #Relative links are skipped: the checker resolves them against the
      #rendered page URL, not the source file, so they all report as broken.
      #percona.community is skipped: its TLD is too long for the checker's URL regex.
      #Azure pricing pages are skipped: they often respond slower than the checker's fixed 3s timeout.
      #Sync mode records timeouts as broken links instead of crashing.
      - name: Check external links
        uses: byrnereese/github-action-mkdocs-link-check@1.0
        with:
          folder-path: 'docs'
          recurse: 'yes'
          synchronous: 'yes'
          excludes: '^(?!https?://)|percona\.community|azure\.microsoft\.com/.*/pricing'
          verbose-mode: 'yes'

  mkdocs-strict-build:
    name: Check internal links
    runs-on: ubuntu-latest

    steps:
      #Pull the latest changes
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      #Prepare the env
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.x'

      #Set up MkDocs
      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      #Strict mode fails the build on links to missing pages or images.
      #Git plugins are disabled: they need full history and API access, not links.
      - name: Build docs in strict mode
        env:
          CI: false
          ENABLED_GIT_REVISION_DATE: false
        run: mkdocs build --strict -f mkdocs.yml
